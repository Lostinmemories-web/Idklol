<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #fff0f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        /* Question Screen */
        #question-screen img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        h1 {
            font-size: 1.8rem;
            color: #d90429;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #yes-btn {
            background-color: #2ec4b6;
            color: white;
            box-shadow: 0 4px 15px rgba(46, 196, 182, 0.4);
            z-index: 10;
        }

        #no-btn {
            background-color: #e71d36;
            color: white;
            box-shadow: 0 4px 15px rgba(231, 29, 54, 0.4);
        }

        /* Success Screen */
        #success-screen h1 {
            margin-bottom: 20px;
        }

        .cat-gif {
            width: 140px;
            margin-bottom: 20px;
        }

        .gifts-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .gift-card {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s;
            width: 100px;
            text-align: center;
        }

        .gift-card:hover {
            transform: translateY(-5px);
        }

        .gift-card img {
            width: 50px;
            margin-bottom: 8px;
        }

        .gift-card span {
            font-size: 0.85rem;
            font-weight: 600;
            color: #666;
        }
